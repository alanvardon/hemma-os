name: CI

# Quality gate for pull requests: lint, unit tests, and a real typecheck
# (tsc -b via the build script — `tsc --noEmit` alone is a no-op here because
# of project references) all have to pass before a PR can merge.

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Lint
        run: npm --prefix web run lint

      - name: Test
        run: npm --prefix web run test

      - name: Build (tsc -b + vite build)
        run: npm --prefix web run build

      - name: Scan emitted assets for privileged secrets
        run: npm --prefix web run verify:build-security

  # E2E golden path (plan 79): Playwright against the production bundle with
  # the Supabase network boundary mocked via page.route — no live Supabase.
  # `needs: quality` so the slow browser install never runs for a build that's
  # already red. Not a required status check yet (shakeout period first).
  e2e:
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      # The Supabase env is pinned inside playwright.config.ts (webServer.env),
      # so the job needs no secrets — the network never leaves the runner.
      - name: E2E (Playwright, mocked network)
        run: npx playwright test
        working-directory: web

  database-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild from migrations
        run: supabase db reset --local

      - name: Verify database security boundary
        run: |
          supabase test db --local supabase/tests/database/security_boundary_test.sql
          supabase test db --local supabase/tests/database/household_isolation_test.sql
          supabase test db --local supabase/tests/database/durable_delete_tombstones_test.sql
          supabase test db --local supabase/tests/database/optimistic_concurrency_test.sql
          supabase test db --local supabase/tests/database/mortgage_agreement_lifecycle_test.sql
          supabase test db --local supabase/tests/database/household_person_identity_test.sql

      - name: Verify durable-delete concurrency
        run: |
          docker cp supabase/test-durable-delete-concurrency.sql supabase_db_hemma-os:/tmp/test-durable-delete-concurrency.sql
          docker exec supabase_db_hemma-os psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/test-durable-delete-concurrency.sql

      - name: Verify optimistic-concurrency races
        run: |
          docker cp supabase/test-optimistic-concurrency.sql supabase_db_hemma-os:/tmp/test-optimistic-concurrency.sql
          docker exec supabase_db_hemma-os psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/test-optimistic-concurrency.sql
