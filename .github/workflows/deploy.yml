name: Deploy Hemma·OS to GitHub Pages

# Builds the React SPA (web/) and publishes the Hemma·OS site to GitHub Pages
# on every push to main. The SPA is the entry point (index.html): it hosts the
# hub (/) and all migrated tools as hash routes (/#/bostadskalkyl, etc.).
# Vanilla tools that haven't yet been migrated to React are served alongside as
# static HTML files — each one is removed from the assembly step once it ships
# as a React route.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

# Permissions GitHub Pages needs to publish from an Action.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Test + lint
        run: |
          npm --prefix web run lint
          npm --prefix web run test

      - name: Require Supabase env
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || { echo '::error::SUPABASE_URL secret is unset'; exit 1; }
          test -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" || { echo '::error::SUPABASE_PUBLISHABLE_KEY secret is unset'; exit 1; }

      - name: Build the React app
        env:
          # Supabase URL + publishable key — injected into the Vite bundle.
          # Both are public by design (RLS guards the data); add them under
          # repo Settings → Secrets and variables → Actions.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Build stamp (plan 100): footer version + the in-app update notice.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm --prefix web run build

      - name: Assemble the Hemma·OS site
        run: |
          mkdir -p _site
          # SPA is the entry point — its index.html IS the hub (/ route).
          cp web/dist/index.html _site/index.html
          cp -r web/dist/bk-assets _site/bk-assets
          # Icons and manifest
          cp icon.svg manifest.webmanifest _site/
          # All tools have now shipped as React routes — nothing vanilla left to copy.
          # bostadskalkyl.html is now the SPA at /#/bostadskalkyl — no vanilla file needed
          # lonevaxling.html is now the SPA at /#/lonevaxling — no vanilla file needed
          # mortgagetracker.html is now the SPA at /#/bolanekoll — no vanilla file needed
          # manadsavslut.html is now the SPA at /#/manadsavslut — no vanilla file needed
          # hushallsbudget.html is now the SPA at /#/hushallsbudget — no vanilla file needed

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
