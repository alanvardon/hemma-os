name: Deploy Hemma·OS

# Builds the React SPA (web/) and publishes it to Cloudflare (Workers static
# assets) at https://www.vardon-family.se/ on every push to main (plan 130:
# real security response headers and the owner's own domain). The old GitHub
# Pages origin (alanvardon.github.io/hemma-os/) is retired: it now publishes
# only legacy-redirect/, which forwards old bookmarks and home-screen icons to
# the new origin with the hash route preserved. The SPA is the entry
# point (index.html): it hosts the hub (/) and all migrated tools as hash
# routes (/#/bostadskalkyl, etc.). Vanilla tools that haven't yet been
# migrated to React are served alongside as static HTML files — each one is
# removed from the assembly step once it ships as a React route.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a deploy by hand from the Actions tab

# Job-level permissions below grant what each publish target actually needs;
# this default covers everything else (checkout only).
permissions:
  contents: read

# One deploy at a time; let an in-progress run finish rather than cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Test + lint
        run: |
          npm --prefix web run lint
          npm --prefix web run test

      - name: Require Supabase env
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || { echo '::error::SUPABASE_URL secret is unset'; exit 1; }
          test -n "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" || { echo '::error::SUPABASE_PUBLISHABLE_KEY secret is unset'; exit 1; }

      - name: Build the React app
        env:
          # Supabase URL + publishable key — injected into the Vite bundle.
          # Both are public by design (RLS guards the data); add them under
          # repo Settings → Secrets and variables → Actions.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Build stamp (plan 100): footer version + the in-app update notice.
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm --prefix web run build

      - name: Reject privileged secrets in emitted assets
        run: npm --prefix web run verify:build-security

      - name: Assemble the Hemma·OS site
        run: |
          mkdir -p _site
          # SPA is the entry point — its index.html IS the hub (/ route).
          cp web/dist/index.html _site/index.html
          cp -r web/dist/bk-assets _site/bk-assets
          # Icons and manifest
          cp icon.svg manifest.webmanifest _site/
          # Security response headers (plan 130 Stage 1) — generated at build
          # time so the hash matches the meta CSP. Cloudflare's Workers static
          # assets reads this the same way Pages does; it is not served as a
          # regular asset.
          cp web/dist/_headers _site/_headers
          # All tools have now shipped as React routes — nothing vanilla left to copy.
          # bostadskalkyl.html is now the SPA at /#/bostadskalkyl — no vanilla file needed
          # lonevaxling.html is now the SPA at /#/lonevaxling — no vanilla file needed
          # mortgagetracker.html is now the SPA at /#/bolanekoll — no vanilla file needed
          # manadsavslut.html is now the SPA at /#/manadsavslut — no vanilla file needed
          # hushallsbudget.html is now the SPA at /#/hushallsbudget — no vanilla file needed

      # The retired GitHub Pages origin serves only the redirect stub (plan 130
      # cutover step 6), never the app — a second app origin would split
      # sessions and local caches.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-redirect

      - name: Upload _site for the Cloudflare deploy job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          # _headers starts with an underscore, not a dot, so the default
          # upload-artifact glob already includes it — no include-hidden-files
          # needed.

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # GitHub Pages publish (redirect stub only) — permissions scoped to this job.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5 # needed for wrangler.jsonc at the repo root

      - name: Download the assembled site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Require Cloudflare env
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo '::error::CLOUDFLARE_API_TOKEN secret is unset'; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo '::error::CLOUDFLARE_ACCOUNT_ID secret is unset'; exit 1; }

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
