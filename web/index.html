<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- The CSP meta (allowing this inline script by sha256) is injected right
         after <meta charset> by the hemma-csp-meta Vite plugin. The hash is
         recomputed from this script's exact body on every build, so editing the
         snippet below needs no manual hash update. -->
    <script>
      // Pre-paint theme to avoid a flash before React mounts. Dark is the app
      // default now — only an explicit stored 'light' opts out. Shares the key
      // with the vanilla app (bostadskalkyl_theme) so the choice carries over.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('bostadskalkyl_theme') === 'light' ? 'light' : 'dark';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted via @font-face in global.css (plan 54) — no
         fonts.googleapis.com / fonts.gstatic.com runtime origins. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="" />
    <title>Hemma·OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
